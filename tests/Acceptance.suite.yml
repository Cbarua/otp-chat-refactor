# Codeception Acceptance Test Suite Configuration
#
# Perform tests in a browser by either emulating one using PhpBrowser, or in a real browser using WebDriver.
# If you need both WebDriver and PhpBrowser tests, create a separate suite for each.

actor: AcceptanceTester
modules:
    enabled:
        # - PhpBrowser:
        #     url: http://localhost/otp-chat-refactor/public/
        - WebDriver:
            # The URL of your application under test
            url: http://localhost:8080/
            
            # The host and port where msedgedriver is running
            host: 127.0.0.1
            port: 10888
            
            # Change browser from 'chrome' to 'MicrosoftEdge'
            browser: MicrosoftEdge 
            
            # It forces W3C-standard communication (e.g., /session)
            # instead of the old protocol (e.g., /wd/hub/session).
            path: /
            
            # Browser-specific settings
            capabilities:
                # Change 'goog:chromeOptions' to 'ms:edgeOptions'
                "ms:edgeOptions":
                    args: ["--headless", "--disable-gpu", "--no-sandbox"]
        - \Tests\Support\Helper\Acceptance
        # Add this line to enable commands like assertContains
        - Asserts
# Add Codeception\Step\Retry trait to AcceptanceTester to enable retries
# step_decorators:
#     - Codeception\Step\ConditionalAssertion
#     - Codeception\Step\TryTo
#     - Codeception\Step\Retry
